server {
    listen 80;
    server_name _;

    # Diretório padrão onde o build do CRA é servido na imagem nginx
    root /usr/share/nginx/html;
    index index.html;

    # Fallback para SPA: qualquer rota client-side cai no index.html
    location / {
        try_files $uri /index.html;
    }

    # Cache agressivo para assets versionados (opcional)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

